[project]
name = "fpl-data-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.0",
  "PyYAML>=6.0",
  "PuLP>=2.8",
  "plotly>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
